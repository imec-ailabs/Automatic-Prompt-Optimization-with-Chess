[project]
name = "chess-self-improvement"
version = "0.1.0"
description = "Chess benchmark for automatic prompt optimization (APO) of frozen LLMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Timothée Lesort" },
    { name = "Alejandra López de Aberasturi Gómez" },
    { name = "Tristan Karch" },
    { name = "Tom Veniat" },
    { name = "Philippe Modard" },
    { name = "Karl Tuyls" },
    { name = "Ludovic Denoyer" },
]
keywords = ["automatic prompt optimization", "LLM", "benchmark", "chess", "DSPy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chess>=1.11,<2",
    "dspy[optuna]>=3.0,<4",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "typer>=0.15,<1",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/imec-ailabs/Automatic-Prompt-Optimization-with-Chess"
Repository = "https://github.com/imec-ailabs/Automatic-Prompt-Optimization-with-Chess"
Issues = "https://github.com/imec-ailabs/Automatic-Prompt-Optimization-with-Chess/issues"
Paper = "https://arxiv.org/abs/2610.00416"

[project.scripts]
chess-bench = "chess_self_improvement.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_self_improvement"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "tests", "configs", "data", "docs", "figures", "README.md", "LICENSE", "NOTICE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chess.*", "dspy.*"]
ignore_missing_imports = true
